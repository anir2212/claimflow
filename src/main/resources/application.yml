spring:
  datasource:
    url: jdbc:h2:mem:claimflow;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
claimflow:
  jwt-secret: ${CLAIMFLOW_JWT_SECRET:local-demo-secret-change-before-sharing}
  token-seconds: 3600
  demo-password: ${CLAIMFLOW_DEMO_PASSWORD:local-only}
  receipt-image:
    max-bytes: 5242880
server:
  address: 127.0.0.1

services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:13306:3306"
    environment:
      MYSQL_DATABASE: claimflow
      MYSQL_USER: claimflow
      MYSQL_PASSWORD: claimflow
      MYSQL_ROOT_PASSWORD: local-root-only
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - claimflow_mysql:/var/lib/mysql
  api:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SERVER_ADDRESS: 0.0.0.0
      CLAIMFLOW_JDBC_URL: jdbc:mysql://mysql:3306/claimflow
      CLAIMFLOW_DB_USER: claimflow
      CLAIMFLOW_DB_PASSWORD: claimflow
      CLAIMFLOW_JWT_SECRET: local-container-secret-change-before-sharing
      CLAIMFLOW_DEMO_PASSWORD: local-only
    ports:
      - "127.0.0.1:18080:8080"
volumes:
  claimflow_mysql:

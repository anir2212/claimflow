# Scrape of the two host-run API instances used by scripts/multiworker_check.py
# (ports 18081 and 18082). Select it with PROMETHEUS_CONFIG=prometheus-two-instances.yml.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: claimflow
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:18081', 'host.docker.internal:18082']

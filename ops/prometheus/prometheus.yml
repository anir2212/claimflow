# Local scrape of one host-run API (`./mvnw spring-boot:run` on 127.0.0.1:8080).
# Used by the optional `monitoring` Compose profile; nothing here is a production deployment.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: claimflow
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']
